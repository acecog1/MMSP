<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Manitou Mystery School — a sovereign journey of study, practice and service.">
<title>MMSP — Journey Portal Prototype</title><style>
:root{color-scheme:light;--ink:#263334;--muted:#526463;--line:#d4ded6;--bg:#faf9f3;--accent:#426b62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
header,main,footer{max-width:980px;margin:auto;padding:1.25rem}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
h1,h2,h3{line-height:1.2}h1{font-size:clamp(2.2rem,6vw,4rem);margin:.5rem 0}h2{font-size:1.6rem}.eyebrow,small{color:var(--muted)}
button,input,textarea,select{font:inherit}button,.button{background:var(--accent);color:white;border:0;border-radius:.5rem;padding:.65rem 1rem;cursor:pointer}
button.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #9e7246;outline-offset:2px}
nav{display:flex;gap:.4rem;flex-wrap:wrap}nav button{font:14px system-ui,sans-serif}
main{min-height:70vh}.panel{background:white;border:1px solid var(--line);border-radius:1rem;padding:1.2rem;margin:1rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}.card{border:1px solid var(--line);border-radius:.7rem;padding:1rem;background:white}
label{display:block;margin:.8rem 0 .3rem;font-weight:bold}input:not([type=checkbox]),textarea,select{width:100%;border:1px solid #9eaaa2;padding:.65rem;border-radius:.4rem;background:white}
textarea{min-height:105px}p{max-width:70ch}.muted{color:var(--muted)}.tag{display:inline-block;background:#e4eee9;border-radius:1rem;padding:.15rem .55rem;font:12px system-ui,sans-serif}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.stack>*+*{margin-top:.8rem}
#notice{min-height:1.5em;color:#2f6353}.hidden{display:none}footer{border-top:1px solid var(--line);color:var(--muted)}
@media(max-width:600px){header{display:block}nav{margin-top:.8rem}nav button{flex:1}header,main,footer{padding:1rem}}
</style></head><body>
<header><div><strong>☉ MANITOU MYSTERY SCHOOL</strong><br><small>A cooperative school in formation</small></div><nav aria-label="Main navigation">
<button class="secondary" data-go="welcome">Welcome</button><button class="secondary" data-go="temples">Temples</button><button class="secondary" data-go="journey">My Journey</button><button class="secondary" data-go="review">Review</button></nav></header>
<main id="app" tabindex="-1"></main><footer><p><strong>Demonstration only.</strong> This prototype stores optional practice information in this browser. Use fictional details; no real mentors, credentials, or accreditation are offered.</p><p>Source: <em>Manitou Mystery School 2025</em>, controlled baseline B0.</p></footer>
<script>
"use strict";
const templeNames=["Origin","Breath","Waters","Earth","Fire","the Heart","Voice","Light","Shadow","Time","Dream","Star","Return"];
const themes=["Creation and sound","Breath and awareness","Emotion and flow","Embodiment and stewardship","Will and transformation","Love and communion","Expression and truth","Discernment and knowledge","Shadow and integration","Cycles and change","Dreams and imagination","Cosmic perspective","Synthesis and service"];
const escaped=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key="mmsp-demo-v1";let data={intention:"",temples:[],activities:[],evidence:[],review:null};
try{const raw=localStorage.getItem(key);if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==="object")data={...data,...parsed};}}catch(_){}
function save(){try{localStorage.setItem(key,JSON.stringify(data));}catch(_){status("Browser storage unavailable. Your work may not persist.");}}
function status(message){const el=document.getElementById("notice");if(el)el.textContent=message;}
const app=document.getElementById("app");
function shell(title,body){app.innerHTML='<p class="eyebrow">THE JOURNEY • DEMO</p><h1>'+title+'</h1>'+body+'<p id="notice" role="status"></p>';app.focus();}
function go(page){({welcome,temples,journey,review,returnPage})[page]?.();}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
function welcome(){shell("The journey belongs to you.",'<p>What calls you to this path?</p><div class="panel"><label for="intent">Your question or intention</label><textarea id="intent" maxlength="2000" placeholder="I want to understand...">'+escaped(data.intention)+'</textarea><div class="actions"><button id="begin">Begin my journey</button><button class="secondary" id="discover">Explore the Temples</button></div></div><p class="muted">We offer companionship, not answers to believe without question.</p>');document.getElementById("begin").onclick=()=>{data.intention=document.getElementById("intent").value.trim();save();temples();};document.getElementById("discover").onclick=temples;}
function temples(){shell("Thirteen Temples",'<p>These are doorways, not a ladder. Choose any that speak to you.</p><div class="grid">'+templeNames.map((n,i)=>'<article class="card"><span class="tag">MOON '+(i+1)+'</span><h2>Temple of '+n+'</h2><p>'+themes[i]+'.</p><button class="'+(data.temples.includes(i)?"secondary":"")+'" data-t="'+i+'">'+(data.temples.includes(i)?"Remove from path":"Add to my path")+'</button></article>').join("")+'</div><div class="actions"><button id="next">View my Journey</button></div>');document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=Number(b.dataset.t);data.temples=data.temples.includes(t)?data.temples.filter(x=>x!==t):[...data.temples,t];save();temples();});document.getElementById("next").onclick=journey;}
function journey(){shell("My Journey",'<p><strong>Your intention:</strong> '+escaped(data.intention||"Not yet written")+'</p><div class="panel"><h2>Your selected Temples</h2><p>'+ (data.temples.length?data.temples.map(i=>escaped(templeNames[i])).join(" · "):"No Temples selected yet.")+'</p><div class="actions"><button class="secondary" id="choose">Choose Temples</button></div></div><div class="panel"><h2>Study Planner</h2><label for="activity">A practice, reading, gathering, or service project</label><input id="activity" maxlength="300"><button id="addActivity">Add activity</button><ul>'+data.activities.map((a,i)=>'<li><label><input type="checkbox" data-done="'+i+'" '+(a.done?"checked":"")+'> '+escaped(a.text)+'</label></li>').join("")+'</ul></div><div class="panel"><h2>Portfolio & Reflection</h2><p>Only you decide which experiences to offer for review.</p><label for="reflection">Reflection or evidence</label><textarea id="reflection" maxlength="4000"></textarea><button id="addEvidence">Record reflection</button><ul>'+data.evidence.map((e,i)=>'<li>'+escaped(e)+' <button class="secondary" data-remove="'+i+'" aria-label="Delete reflection '+(i+1)+'">Remove</button></li>').join("")+'</ul></div><div class="actions"><button id="reviewNow">Explore community review</button><button class="secondary" id="export">Export Journey JSON</button><button class="secondary" id="reset">Erase local demo</button></div>');document.getElementById("choose").onclick=temples;document.getElementById("addActivity").onclick=()=>{const text=document.getElementById("activity").value.trim();if(text){data.activities.push({text,done:false});save();journey();}};document.querySelectorAll("[data-done]").forEach(el=>el.onchange=()=>{data.activities[Number(el.dataset.done)].done=el.checked;save();});document.getElementById("addEvidence").onclick=()=>{const t=document.getElementById("reflection").value.trim();if(t){data.evidence.push(t);save();journey();}};document.querySelectorAll("[data-remove]").forEach(el=>el.onclick=()=>{data.evidence.splice(Number(el.dataset.remove),1);save();journey();});document.getElementById("reviewNow").onclick=review;document.getElementById("export").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="my-mmsp-demo-journey.json";a.click();URL.revokeObjectURL(url);};document.getElementById("reset").onclick=()=>{if(confirm("Erase your local demonstration Journey?")){data={intention:"",temples:[],activities:[],evidence:[],review:null};save();welcome();}};}
function review(){shell("Community Board of Review",'<p>When you are ready, your community may examine what you learned, how you explored, and how you served. Review is about demonstrated learning—not a judgment of enlightenment.</p><div class="panel"><h2>Your proposed submission</h2><p>'+data.temples.length+' chosen Temples · '+data.activities.filter(a=>a.done).length+' completed activities · '+data.evidence.length+' reflections</p><p class="muted">Demo only. No real Board members will receive this submission.</p><button id="submit">Create mock submission snapshot</button></div>'+(data.review?'<div class="panel"><h2>Mock review snapshot</h2><p>Created: '+escaped(data.review.created)+'</p><p>'+data.review.evidence.length+' reflections frozen for the mock review.</p><button id="complete">See the Return</button></div>':"")+'<div class="actions"><button class="secondary" id="back">Return to Journey</button></div>');document.getElementById("submit").onclick=()=>{data.review={created:new Date().toISOString(),intention:data.intention,temples:[...data.temples],activities:data.activities.map(a=>({...a})),evidence:[...data.evidence]};save();review();};document.getElementById("complete")?.addEventListener("click",returnPage);document.getElementById("back").onclick=journey;}
function returnPage(){shell("The Temple of Return",'<p>Your journey continues. What you discover may become a lantern for another traveler.</p><div class="panel"><h2>Demonstration recognition</h2><p>This screen shows how a future review outcome could appear. <strong>It is not a credential, graduation, or institutional approval.</strong></p><p>The next step is yours: deepen your study, invite a fellow traveler, or offer a work of service.</p><button id="continue">Continue my journey</button></div>');document.getElementById("continue").onclick=journey;}
welcome();
</script></body></html>
